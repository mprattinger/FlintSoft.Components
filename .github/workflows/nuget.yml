name: Build and publish NuGet package

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Check out full history for GitVersion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: 6.x

      - name: Determine version with GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0
        with:
          useConfigFile: true
      
      - name: Restore dependencies
        run: dotnet restore

      - name: Run component tests
        run: dotnet test tests/FlintSoft.Components.Tests/FlintSoft.Components.Tests.csproj --configuration Release --verbosity minimal --no-restore

      - name: Pack
        run: |
          dotnet pack src/FlintSoft.Components.csproj --configuration Release --output artifacts --no-restore `
            -p:ContinuousIntegrationBuild=true `
            -p:Version=${{ steps.gitversion.outputs.package }} `
            -p:PackageVersion=${{ steps.gitversion.outputs.package }} `
            -p:AssemblyVersion=${{ steps.gitversion.outputs.assembly }} `
            -p:FileVersion=${{ steps.gitversion.outputs.file }} `
            -p:InformationalVersion=${{ steps.gitversion.outputs.informational }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: FlintSoft.Components.${{ steps.gitversion.outputs.package }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: mprattinger 

      - name: Publish to NuGet.org  
        run: 
          dotnet nuget push "artifacts\*.nupkg" --source https://api.nuget.org/v3/index.json `
            --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate
