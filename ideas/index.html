<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <p>
      Basic Input
    <div class="input-container">
      <div class="input-row">
        <div class="input-control">
          <input id="input-one" type="text" placeholder=" " />

          <label for="input-one">Input One</label>
        </div>
      </div>
    </div>
    </p>
    <p>
      Prefix Input
    <div class="input-container">
      <div class="input-row">
        <span class="input-affix prefix">$</span>
        <div class="input-control">

          <input id="input-one" type="text" placeholder=" " />

          <label for="input-one">Input One</label>
        </div>
      </div>
    </div>
    </p>
    <p>
      Suffix Input
    <div class="input-container">
      <div class="input-row">
        <div class="input-control">
          <input id="input-one" type="text" placeholder=" " />

          <label for="input-one">Input One</label>
        </div>
        <span class="input-affix suffix">%</span>
      </div>
    </div>
    </p>

    <p>
      Invalid Input
    <div class="input-container has-error">
      <div class="input-row">
        <div class="input-control">
          <input id="input-one" type="text" placeholder=" " />
    
          <label for="input-one">Input One</label>
        </div>
      </div>
      <div class="validation-message">This field is required.</div>
    </div>
    </p>
  </div>
</body>

</html>
